#
# Minimal continuous integration: build the tree from scratch on Linux and
# macOS, run the unit tests and hygiene checks, then run the loopback smoke
# test, which starts a real post-quantum bootstrap and a real PTY over UDP on
# the runner itself. The clang job also runs the static analyzer, and a
# separate job runs the unit tests under AddressSanitizer and
# UndefinedBehaviorSanitizer. Nothing here contacts a network host.

name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-gcc
            cc: gcc
          - os: ubuntu-latest
            name: linux-clang
            cc: clang
          - os: macos-latest
            name: macos-clang
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: compiler version
        run: ${{ matrix.cc }} --version

      - name: build
        run: make -j2

      - name: unit tests, symbol hygiene, shell syntax
        run: make check

      - name: static analysis
        if: matrix.name == 'linux-clang'
        run: make analyze

      - name: loopback smoke
        run: make smoke

      - name: source bundle builds and tests from a clean directory
        run: |
          set -eu
          make bundle
          mkdir -p "$RUNNER_TEMP/frombundle"
          tar -xzf dist/unmoor-*.tar.gz -C "$RUNNER_TEMP/frombundle"
          cd "$RUNNER_TEMP/frombundle/unmoor"
          make -j2
          make check
          make smoke

  sanitizers:
    name: linux-clang-sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: compiler version
        run: clang --version

      - name: unit tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: >
          make -j2 test
          CFLAGS='-O1 -g -std=c11 -Wall -Wextra -fsanitize=address,undefined
          -fno-sanitize-recover=all -fno-omit-frame-pointer'
          LDFLAGS='-fsanitize=address,undefined'
